# suite config
# RUN `build` COMMAND AFTER ADDING/REMOVING MODULES.
namespace: Tests
support_namespace: Support
suites:
    api:
        actor: ApiTester
        path: Api
        modules:
            enabled:
                - REST:
                    url: '%LADECADANSE_API_URL%'
                    depends: PhpBrowser
                    part: Json
                - Asserts
        step_decorators:
            - \Codeception\Step\AsJson
    site:
        actor: SiteTester
        path: Site
        modules:
            enabled:
                - PhpBrowser:
                    url: '%LADECADANSE_SITE_URL%'
                - Asserts
    unit:
        actor: UnitTester
        path: Unit
        modules:
            enabled:
                - Asserts

paths:
    tests: tests
    output: tests/_output
    data: tests/Support/Data
    support: tests/Support
    envs: tests/_envs
actor_suffix: Tester
settings:
    shuffle: false
    lint: true

params:
    - tests/.env
