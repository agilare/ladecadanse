services:
  # Database service - shared between dev and prod
  db:
    image: mariadb:10.11
    container_name: ladecadanse_db
    environment:
      MYSQL_DATABASE: ladecadanse
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-dev}
      MYSQL_USER: ${DB_USER:-dev}
      MYSQL_PASSWORD: ${DB_PASSWORD:-dev}
    volumes:
      - ladecadanse_db_data:/var/lib/mysql
      - ./resources/database/ladecadanse.sql:/docker-entrypoint-initdb.d/001_ladecadanse.sql
      - ./docker/env/create-admin.sql:/docker-entrypoint-initdb.d/002_create-admin.sql
      - ./docker/env/create-lieux.sql:/docker-entrypoint-initdb.d/003_create-lieux.sql
    ports:
      - "127.0.0.1:${DB_PORT:-9906}:3306"
    networks:
      - ladecadanse_net
    profiles:
      - dev
      - prod

  # Composer services
  composer-dev:
    image: composer:2.7
    container_name: ladecadanse_composer_dev
    command: install --optimize-autoloader --ignore-platform-reqs
    environment:
      # vendor/ est sur le bind mount : extraire des milliers de petits fichiers
      # y est lent (surtout sous Docker Desktop) et dépasse le timeout de 300 s
      # par défaut de Composer, ce qui fait échouer l'install.
      COMPOSER_PROCESS_TIMEOUT: 1800
    volumes:
      - .:/app
    working_dir: /app
    profiles:
      - dev

  composer-prod:
    image: composer:2.7
    container_name: ladecadanse_composer_prod
    command: install --no-dev --optimize-autoloader --no-scripts --ignore-platform-reqs
    environment:
      COMPOSER_PROCESS_TIMEOUT: 1800
    volumes:
      - .:/app
    working_dir: /app
    profiles:
      - prod

  web-dev:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
      target: development
      args:
        # Aligne www-data sur l'utilisateur de l'hôte pour que le code monté en
        # bind mount reste inscriptible. Sur Linux, renseigner UID/GID dans un
        # fichier .env à la racine (voir README).
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: ladecadanse_php_dev
    depends_on:
      db:
        condition: service_started
      composer-dev:
        condition: service_completed_successfully
    environment:
      - APP_ENV=dev
      - APP_DEBUG=true
    volumes:
      - .:/var/www/html/
      - ./docker/apache/ladecadanse.conf:/etc/apache2/sites-enabled/000-default.conf
      - ./docker/env/env.php:/var/www/html/app/env.php
      - ./docker/env/db.config.php:/var/www/html/app/db.config.php
    ports:
      - "127.0.0.1:${WEB_PORT:-7777}:80"
    networks:
      - ladecadanse_net
    extra_hosts:
      - host.docker.internal:host-gateway
    stdin_open: true
    tty: true
    profiles:
      - dev

  # Production services
  web-prod:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
      target: production
    container_name: ladecadanse_php_prod
    depends_on:
      db:
        condition: service_started
      composer-prod:
        condition: service_completed_successfully
    environment:
      - APP_ENV=prod
      - APP_DEBUG=false
    volumes:
      - .:/var/www/html/
      - ./docker/env/env.php:/var/www/html/app/env.php
      - ./docker/env/db.config.php:/var/www/html/app/db.config.php
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    networks:
      - ladecadanse_net
    restart: unless-stopped
    profiles:
      - prod

networks:
  ladecadanse_net:

volumes:
  ladecadanse_db_data:
