<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Trop de requêtes — La décadanse</title>
    <meta name="robots" content="noindex">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!--
        Page d'erreur 429 d'Apache (htaccess/60-erreurs.conf), statique à dessein : un 429 répond
        à qui demande trop, et une page qui coûterait un bootstrap PHP et une connexion MySQL
        aggraverait ce qu'elle refuse. Même gabarit que forbidden.html et server-error.html.
    -->
    <style>
        body { margin: 0; font-family: Verdana, Arial, sans-serif; color: #4c4c4c; background: #fff; }
        header { background: #f5b335; }
        header img { display: block; }
        main { max-width: 36em; margin: 4em auto; padding: 0 1.2em; }
        h1 { font-size: 2.2em; color: #5C7378; margin: 0 0 0.3em; }
        a { color: #105199; }
    </style>
</head>
<body>
    <header><a href="/"><img src="/web/interface/logo_titre.jpg" alt="La décadanse" width="180" height="35"></a></header>
    <main>
        <h1>Erreur 429</h1>
        <h2>Trop de requêtes</h2>
        <p>Le serveur reçoit trop de connexions et doit en refuser. Veuillez réessayer un peu plus tard.</p>
        <p>En cas de besoin, vous pouvez <a href="mailto:info@ladecadanse.ch">me contacter</a>.</p>
        <p><a href="/">Revenir à l'accueil de La décadanse</a></p>
    </main>
</body>
</html>
