; ============================================================================
;  .user.ini — FICHIER GÉNÉRÉ, NE PAS ÉDITER
;
;  Composé par « composer config:build » à partir des fragments de userini/
;  (publics, suivis par git) et de ceux du dépôt privé ladecadanse-docs.
;  Voir docs/config-serveur.md.
;
;  PHP ne lit ce fichier que sous CGI/FastCGI — l'API serveur d'Infomaniak.
;  Sous mod_php, celui du poste de développement, il est ignoré sans un mot :
;  les réglages locaux passent par htaccess/70-dev-php.conf.
; ============================================================================

; ── 00 · COMMUN ─────────────────────────────────────────────────────────────

; app/config.php fait foi et app/bootstrap.php applique la valeur ; ce réglage
; ne couvre que ce qui s'exécute avant le bootstrap, et les scripts qui ne
; passent pas par lui
date.timezone = "Europe/Zurich"

; Sessions d'une heure. Le PHP local est à 36000 (dix heures) par défaut : une
; expiration de session ne se voit donc jamais en développement
session.gc_maxlifetime = 3600

display_startup_errors = Off

; Envois de fichiers. L'hébergement autorise bien plus (300 Mo) : ces valeurs
; l'abaissent volontairement. app/config.php porte les mêmes limites côté
; applicatif, avec un POST_MAX_SIZE (12 Mo) délibérément inférieur aux 14 Mo
; ci-dessous : passé le post_max_size réel, PHP vide $_POST et $_FILES, et plus
; aucun message d'erreur ne peut être affiché à l'utilisateur.
; Le pendant pour le poste de développement est dans htaccess/70-dev-php.conf.
; max_file_uploads n'y figure pas : c'est une directive PHP_INI_SYSTEM, qu'un
; .user.ini ne peut pas modifier. Le nombre de fichiers par envoi se limite
; donc par le formulaire lui-même.
upload_max_filesize = 5M
post_max_size = 14M
