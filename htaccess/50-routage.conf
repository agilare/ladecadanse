
# ── 50 · ROUTAGE APPLICATIF ─────────────────────────────────────────────────
#
#  LA SECTION QUI SUIT LE CODE. Toute page déplacée ou renommée se répercute
#  ici, dans le même commit : c'est la seule partie du .htaccess qui se périme
#  quand le dépôt bouge, et c'est par elle que la production a divergé.

# --- Icônes -----------------------------------------------------------------
Redirect 301 /favicon.ico /web/interface/favicon.png
Redirect 301 /apple-touch-icon.png /web/interface/apple-icon.png
Redirect 301 /apple-touch-icon-precomposed.png /web/interface/apple-icon.png
Redirect 301 /apple-touch-icon-120x120-precomposed.png /web/interface/apple-icon-120x120.png
Redirect 301 /apple-touch-icon-120x120.png /web/interface/apple-icon-120x120.png
Redirect 301 /apple-touch-icon-76x76.png /web/interface/apple-icon-76x76.png

Redirect 301 /images/interface/radio_vostok.png /web/content/radio_vostok.png

# --- Raccourcis -------------------------------------------------------------
RewriteRule ^lausanne /index.php?region=vd [NC,R=301,L]
RewriteRule ^fribourg /index.php?region=fr [NC,R=301,L]
RewriteRule ^geneve /index.php?region=ge [NC,R=301,L]

# --- Anciennes URL vers les nouvelles ---------------------------------------
# La query string est reportée d'office tant que la substitution n'en porte
# aucune : ?idP= des profils, ?token= des liens de réinitialisation reçus par
# courriel — ces derniers restent valables 24 h, la redirection doit donc
# survivre au déplacement de la page.
RewriteRule ^agenda\.php /index.php [NC,R=301,L]
RewriteRule ^evenement-agenda\.php /index.php [NC,R=301,L]
RewriteRule ^evenement-search\.php /event/search.php [NC,R=301,L]
RewriteRule ^evenement\.php /event/evenement.php [NC,R=301,L]
RewriteRule ^api\.php /event/api.php [NC,R=301,L]
RewriteRule ^rss\.php /event/rss.php [NC,R=301,L]
RewriteRule ^lieu\.php /lieu/lieu.php [NC,R=301,L]
RewriteRule ^lieux\.php /lieu/lieux.php [NC,R=301,L]
RewriteRule ^organisateur\.php /organisateur/organisateur.php [NC,R=301,L]
RewriteRule ^organisateurs\.php /organisateur/organisateurs.php [NC,R=301,L]
RewriteRule ^contacteznous\.php /misc/contacteznous.php [NC,R=301,L]
RewriteRule ^user-login\.php /user/login.php [NC,R=301,L]
RewriteRule ^user-register\.php /user/register.php [NC,R=301,L]
RewriteRule ^user-reset\.php /user/reset.php [NC,R=301,L]
RewriteRule ^user-reset2\.php /user/reset2.php [NC,R=301,L]
RewriteRule ^user\.php /user/dashboard.php [NC,R=301,L]

# --- Images d'événements ----------------------------------------------------
# Sauf si le fichier existe, les images des années 2005 à 2025 posées
# directement sous evenements/ sont redirigées vers evenements/{année}/
RewriteCond %{REQUEST_FILENAME} !-f
RewriteRule ^web/uploads/evenements/(s_)?(\d+)_(200[5-9]|201[0-9]|202[0-5])-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])(.*)\.(jpe?g?|png|gif)$ /web/uploads/evenements/$3/$1$2_$3-$4-$5$6.$7 [NC,R=301,L]

# --- SEO --------------------------------------------------------------------
# Les vignettes (s_*) n'ont pas à être indexées
<IfModule mod_headers.c>
  <If "%{REQUEST_URI} =~ m#/web/uploads/(evenements|lieux|organisateurs)(/[^/]+)?/s_.*\.(jpg|jpeg|png|webp|gif)$#">
    Header set X-Robots-Tag "noindex"
  </If>
</IfModule>
