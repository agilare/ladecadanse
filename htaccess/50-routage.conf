
# ── 50 · ROUTAGE APPLICATIF ─────────────────────────────────────────────────
#
#  LA SECTION QUI SUIT LE CODE. Toute page déplacée ou renommée se répercute
#  ici, dans le même commit : c'est la seule partie du .htaccess qui se périme
#  quand le dépôt bouge, et c'est par elle que la production a divergé.

# --- Icônes -----------------------------------------------------------------
Redirect 301 /favicon.ico /web/interface/favicon.png
Redirect 301 /apple-touch-icon.png /web/interface/apple-icon.png
Redirect 301 /apple-touch-icon-precomposed.png /web/interface/apple-icon.png
Redirect 301 /apple-touch-icon-120x120-precomposed.png /web/interface/apple-icon-120x120.png
Redirect 301 /apple-touch-icon-120x120.png /web/interface/apple-icon-120x120.png
Redirect 301 /apple-touch-icon-76x76.png /web/interface/apple-icon-76x76.png

Redirect 301 /images/interface/radio_vostok.png /web/content/radio_vostok.png

# --- Raccourcis -------------------------------------------------------------
RewriteRule ^lausanne /index.php?region=vd [NC,R=301,L]
RewriteRule ^fribourg /index.php?region=fr [NC,R=301,L]
RewriteRule ^geneve /index.php?region=ge [NC,R=301,L]

# --- Anciennes URL vers les nouvelles ---------------------------------------
# La query string est reportée d'office tant que la substitution n'en porte
# aucune : ?idP= des profils, ?token= des liens de réinitialisation reçus par
# courriel — ces derniers restent valables 24 h, la redirection doit donc
# survivre au déplacement de la page.
RewriteRule ^agenda\.php /index.php [NC,R=301,L]
RewriteRule ^evenement-agenda\.php /index.php [NC,R=301,L]
RewriteRule ^evenement-search\.php /event/search.php [NC,R=301,L]
RewriteRule ^evenement\.php /event/evenement.php [NC,R=301,L]
RewriteRule ^api\.php /event/api.php [NC,R=301,L]
RewriteRule ^rss\.php /event/rss.php [NC,R=301,L]
RewriteRule ^lieu\.php /lieu/lieu.php [NC,R=301,L]
RewriteRule ^lieux\.php /lieu/lieux.php [NC,R=301,L]
RewriteRule ^organisateur\.php /organisateur/organisateur.php [NC,R=301,L]
RewriteRule ^organisateurs\.php /organisateur/organisateurs.php [NC,R=301,L]
RewriteRule ^contacteznous\.php /misc/contacteznous.php [NC,R=301,L]
RewriteRule ^user-login\.php /user/login.php [NC,R=301,L]
RewriteRule ^user-register\.php /user/register.php [NC,R=301,L]
RewriteRule ^user-reset\.php /user/reset.php [NC,R=301,L]
RewriteRule ^user-reset2\.php /user/reset2.php [NC,R=301,L]
RewriteRule ^user\.php /user/dashboard.php [NC,R=301,L]

# Back-office : la page n'a ni lien entrant public ni référencement, mais les
# administrateurs l'ont en signet et en historique depuis des années.
RewriteRule ^admin/gererEvenements\.php /admin/events.php [NC,R=301,L]

# Formulaires d'édition : réservés aux connectés, donc pas indexés, mais les
# organisateurs arrivent dessus par leurs signets, avec ?action= et ?idO= / ?idL=.
RewriteRule ^organisateur-edit\.php /organisateur/edit.php [NC,R=301,L]
RewriteRule ^lieu-edit\.php /lieu/edit.php [NC,R=301,L]
# Ancrée au début, donc distincte de ^lieu-edit\.php comme de ^lieu\.php
RewriteRule ^lieu-text-edit\.php /lieu/text-edit.php [NC,R=301,L]
RewriteRule ^user-edit\.php /user/edit.php [NC,R=301,L]

# --- Images d'événements ----------------------------------------------------
# Sauf si le fichier existe, les images des années 2005 à 2025 posées
# directement sous evenements/ sont redirigées vers evenements/{année}/, où
# l'archivage annuel les a déplacées.
#
# La borne haute s'arrête volontairement à l'année précédente : getFilePath()
# (librairies/Evenement.php) ne préfixe l'année qu'une fois celle-ci révolue,
# donc une image de l'année en cours vit encore à la racine. L'inclure ici
# changerait ses 404 en redirections vers un répertoire qui n'existe pas encore.
#
# À ÉTENDRE CHAQUE 1er JANVIER, dans le même geste que le déplacement des
# fichiers — sans quoi les anciennes URL de l'année qui vient de s'achever
# répondent 404. La maintenance annuelle le rappelle (ladecadanse-docs,
# 10_Maintenance.md, « Annuelle (début janvier) »).
#
# Les extensions doivent couvrir tout ce que ImageDriver2 sait écrire, webp
# compris : depuis que les PDF sont convertis à l'envoi (web/js/pdf-to-image.js),
# c'est le format qui arrive le plus souvent.
RewriteCond %{REQUEST_FILENAME} !-f
RewriteRule ^web/uploads/evenements/(s_)?(\d+)_(200[5-9]|201[0-9]|202[0-5])-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])(.*)\.(jpe?g?|png|gif|webp)$ /web/uploads/evenements/$3/$1$2_$3-$4-$5$6.$7 [NC,R=301,L]

# --- SEO --------------------------------------------------------------------
# robots.txt est servi par un script qui y écrit l'année en cours et la suivante
RewriteRule ^robots\.txt$ /misc/robots.php [L]

# Les vignettes (s_*) n'ont pas à être indexées
<IfModule mod_headers.c>
  <If "%{REQUEST_URI} =~ m#/web/uploads/(evenements|lieux|organisateurs)(/[^/]+)?/s_.*\.(jpg|jpeg|png|webp|gif)$#">
    Header set X-Robots-Tag "noindex"
  </If>
</IfModule>

# --- Pages servies depuis pages/ --------------------------------------------
# Les pages vivent sous pages/ sans que leurs URL le montrent : /event/evenement.php
# est servi par pages/event/evenement.php. L'URL ne mène donc plus directement
# au fichier — ajouter pages/ devant pour le trouver. Déplacer une page À
# L'INTÉRIEUR de pages/ change son URL comme avant (301 ci-dessus) ; l'y
# faire entrer ou en sortir, non. tests/Unit/RoutageTest.php garde ces règles,
# sans lesquelles tout le site répond 404.
#
# 1. /pages/… tapé à la main : 301 vers l'URL propre, pour qu'aucune page n'ait
#    deux adresses. THE_REQUEST est la ligne de requête d'origine : la règle
#    ignore les réécritures internes ci-dessous et les ErrorDocument.
RewriteCond %{THE_REQUEST} ^\S+\s/pages/ [NC]
RewriteRule ^pages/(.*)$ /$1 [R=301,L]

# 2. L'accueil
RewriteRule ^$ pages/index.php [L]

# 3. Tout script .php absent de la racine est cherché sous pages/, path info
#    compris (/event/evenement.php/x) ; un répertoire, par son index.php
#    (/admin/). Les pages restées à la racine (evenement-edit.php,
#    annuaire-membres.php) passent par le !-f. La condition sur pages/ arrête la
#    boucle des réécritures en contexte de répertoire ; une URL inconnue
#    aboutit à un 404 ordinaire sous pages/. Une page ajoutée sous pages/ n'a
#    rien à déclarer ici.
#
#    EN DERNIER : les 301 des anciennes URL ci-dessus visent des fichiers qui
#    n'existent pas à la racine (lieux.php…) ; placée avant, cette règle les
#    changerait en 404.
RewriteCond $1 !^pages/
RewriteCond %{REQUEST_FILENAME} !-f
RewriteRule ^(.+?\.php)(/.*)?$ pages/$1$2 [L]

RewriteCond $1 !^pages/
RewriteCond %{REQUEST_FILENAME} !-d
RewriteRule ^(.+/)$ pages/$1index.php [L]
