
# ── 60 · PAGES D'ERREUR ─────────────────────────────────────────────────────
#
#  pages/misc/error.php traite ces codes. Attention : une cible inexistante ne
#  produit aucune erreur de configuration, Apache sert simplement sa page par
#  défaut — c'est ainsi que la 404 personnalisée avait disparu de la production
#  sans que rien ne le signale.

ErrorDocument 403 /pages/misc/error.php
ErrorDocument 404 /pages/misc/error.php
ErrorDocument 429 /pages/misc/error.php
ErrorDocument 500 /pages/misc/error.php
