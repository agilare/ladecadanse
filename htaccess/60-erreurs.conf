
# ── 60 · PAGES D'ERREUR ─────────────────────────────────────────────────────
#
#  Tout va à des pages statiques, servies sans PHP, sauf le 404 : 403, dont les
#  destinataires sont pour l'essentiel des robots refusés par le pare-feu ou par
#  les blocages de User-Agent, à plusieurs requêtes par seconde ; 429, qui répond
#  à qui demande trop ; 500, 502, 503 et 504, où PHP est en défaut ou ne répond
#  plus et où une page qui en dépendrait serait la première à manquer — les trois
#  derniers partagent une page, qui ne peut donc pas afficher le code.
#  pages/misc/error.php, qui coûte un bootstrap et une connexion MySQL — et compte la
#  requête dans le suivi des bots —, ne garde que le 404, dont les destinataires
#  sont aussi des visiteurs. Les cibles sont exemptées des règles de réécriture
#  dans 00-core.conf, sans quoi la redirection interne serait rebloquée.
#
#  pages/misc/unavailable.html n'est pas d'ici : app/bootstrap.php la sert lui-même,
#  en 503, quand c'est la base de données qui manque.
#
#  Attention : une cible inexistante ne produit aucune erreur de configuration,
#  Apache sert simplement sa page par défaut — c'est ainsi que la 404
#  personnalisée avait disparu de la production sans que rien ne le signale.

ErrorDocument 403 /pages/misc/forbidden.html
ErrorDocument 404 /pages/misc/error.php
ErrorDocument 429 /pages/misc/too-many-requests.html
ErrorDocument 500 /pages/misc/server-error.html
ErrorDocument 502 /pages/misc/gateway-error.html
ErrorDocument 503 /pages/misc/gateway-error.html
ErrorDocument 504 /pages/misc/gateway-error.html
