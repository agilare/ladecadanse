
# ── 60 · PAGES D'ERREUR ─────────────────────────────────────────────────────
#
#  misc/error.php traite les trois codes. Attention : une cible inexistante ne
#  produit aucune erreur de configuration, Apache sert simplement sa page par
#  défaut — c'est ainsi que la 404 personnalisée avait disparu de la production
#  sans que rien ne le signale.

ErrorDocument 404 /misc/error.php
ErrorDocument 429 /misc/error.php
ErrorDocument 500 /misc/error.php
