
# ── 70 · PHP EN DÉVELOPPEMENT ───────────────────────────────────────────────
#
#  Ce bloc n'existe que pour le poste de développement, où Apache charge PHP
#  comme module. En production l'API serveur est FPM/FastCGI : le module n'est
#  pas chargé, le bloc est ignoré, et les réglages viennent de .user.ini.
#
#  C'est ce garde qui permet à un seul .htaccess de servir les deux
#  environnements : hors <IfModule>, php_flag provoque une erreur 500 sous FPM.

<IfModule php_module>
	php_flag display_startup_errors off
	php_flag display_errors on
	# E_ALL vaut -1, à l'épreuve des changements de codes entre versions.
	# En production : E_ALL & ~E_DEPRECATED & ~E_NOTICE, réglé dans .user.ini
	php_value error_reporting -1
</IfModule>
