# ============================================================================
#  .htaccess — FICHIER GÉNÉRÉ, NE PAS ÉDITER
#
#  Composé par `composer config:build` à partir des fragments de `htaccess/` (publics,
#  suivis par git) et de ceux du dépôt privé ladecadanse-docs (blocages et
#  réglages propres à l'hébergement). Une modification faite directement dans
#  le .htaccess est perdue à la prochaine composition — et `composer deploy`
#  recompose avant d'envoyer.
#
#  Le même fichier sert en local et en production : chaque fragment est inerte
#  là où il ne s'applique pas. Voir docs/config-serveur.md.
# ============================================================================

# ── 00 · SOCLE ──────────────────────────────────────────────────────────────

ServerSignature Off

# -Indexes    : pas de listage de répertoire
# -MultiViews : pas de résolution implicite du nom de fichier
Options -Indexes -MultiViews

RewriteEngine On
RewriteBase /

# La page d'erreur ne doit jamais retomber sous les règles de blocage qui
# suivent (10-blocages, 20-firewall-8g) : sinon ErrorDocument 403/404/429/500
# la redemande en interne, elle se fait rebloquer par la même condition
# (User-Agent, IP…), et la boucle dépasse LimitInternalRecursion (10) →
# AH00124, 500 générique côté client. Constaté le 12.09.2026 avec
# SERankingBacklinksBot après activation de son blocage dans 10-blocages.conf.
RewriteRule ^misc/error\.php$ - [L]

# Si un .git se retrouve sur le serveur, il ne doit pas être lisible
RedirectMatch 404 /\.git
