
# ── 30 · CHEMINS PROTÉGÉS ───────────────────────────────────────────────────
#
#  Ces règles suivent l'arborescence du dépôt : elles sont à revoir quand un
#  répertoire est ajouté ou déplacé.

# Fichiers de sauvegarde et de travail que laissent certains éditeurs.
# `in[ci]` couvre .inc et .ini : c'est ce qui protège .user.ini, qui contient
# les réglages PHP de production.
<FilesMatch "(^#.*#|\.(bak|conf|dist|env|fla|in[ci]|log|md|old|orig|psd|sh|sql|sw[op]|tmp)|~)$">
	Require all denied
</FilesMatch>

<FilesMatch "(composer\.json|composer\.lock)$">
	Require all denied
</FilesMatch>

# Répertoires applicatifs : pas d'accès HTTP, mais les inclusions PHP restent
# possibles (la condition ne porte que sur un fichier réellement demandé)
RewriteCond %{REQUEST_URI} ^/(var|app|librairies|resources|bin)
RewriteCond %{REQUEST_FILENAME} -f
RewriteRule ^(var|app|librairies|resources|bin) - [F,L]

# uploads/ ne sert que des images
RewriteCond %{REQUEST_URI} ^/web/uploads/ [NC]
RewriteCond %{REQUEST_URI} !\.(jpg|jpeg|png|gif|webp)$ [NC]
RewriteRule .* - [F]
