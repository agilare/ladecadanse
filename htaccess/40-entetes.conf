
# ── 40 · EN-TÊTES ───────────────────────────────────────────────────────────

# Les modules ES de pdf.js sont livrés en .mjs, et un navigateur refuse un
# module servi sous un type qui n'est pas celui d'un script.
#
# Ne pas retirer cette ligne en la croyant redondante : la table livrée avec
# Apache connaît .mjs (vérifié sur 2.4.62), mais en production c'est celle du
# paquet Debian media-types qui fait foi, et Bullseye est assez ancien pour ne
# pas la porter. La panne n'apparaîtrait qu'en ligne.
AddType text/javascript .mjs

# Les miniatures d'événement sont écrites en WebP depuis #170. Même raisonnement que pour
# .mjs ci-dessus : la table livrée avec Apache connaît .webp, mais en production c'est celle
# du paquet Debian media-types qui fait foi. Un WebP servi en application/octet-stream ne
# s'afficherait pas, et la panne n'apparaîtrait qu'en ligne.
#
# Sans effet là où le type est déjà connu — AddType se contente de le redéclarer.
AddType image/webp .webp

# Ajax, fetch, WebSocket depuis des sites partenaires
SetEnvIf Origin "^(https://noctambus.ch|https://www.noctambus.ch|https://maps.googleapis.com|https://browser.sentry-cdn.com)$" AccessControlAllowOrigin=$0
Header set Access-Control-Allow-Origin %{AccessControlAllowOrigin}e env=AccessControlAllowOrigin

# HSTS et Permissions-Policy sont posés par le frontal d'Infomaniak — vérifié
# le 23.08.2026 : `strict-transport-security: max-age=16000000` et une
# Permissions-Policy complète arrivent sans que ce fichier les demande. Les
# poser ici aussi produisait un en-tête en double, dont seul le premier (celui
# de l'hébergeur) est retenu par les navigateurs.
#
# À réactiver sur un hébergement qui ne les pose pas. Noter que la syntaxe
# ci-dessous corrige celle qui était en service : Permissions-Policy s'écrit
# `(self)` sans apostrophes — `('self')` est la syntaxe de CSP et invalide ici.
#
# Header always set Strict-Transport-Security "max-age=16000000" env=HTTPS
# Header set Permissions-Policy "accelerometer=(), ambient-light-sensor=(), autoplay=(), battery=(), camera=(), cross-origin-isolated=(), display-capture=(), document-domain=(), encrypted-media=(), execution-while-not-rendered=(), execution-while-out-of-viewport=(), fullscreen=(self), geolocation=(), gyroscope=(), keyboard-map=*, magnetometer=(), microphone=(), midi=(), navigation-override=(), payment=(), picture-in-picture=(), publickey-credentials-get=*, screen-wake-lock=(), sync-xhr=(self), usb=(), web-share=*, xr-spatial-tracking=()"

# --- Cache des fichiers envoyés ---------------------------------------------
#
# Les images d'uploads partaient sans Cache-Control ni Expires, avec pour seuls repères
# ETag et Last-Modified : le navigateur revalidait chaque miniature à chaque visite, soit
# jusqu'à 113 requêtes conditionnelles pour un samedi chargé — de la latence et des accès
# disque pour ne récolter que des 304.
#
# Le cache long est sans risque ici, et c'est la condition qu'« immutable » exige :
# AssetManager::get() suffixe chaque URL de ?v= + les 8 premiers caractères du md5_file().
# Le contenu change, l'URL change, donc un cache d'un an ne peut pas servir de version
# périmée. « immutable » supprime en outre la revalidation au rechargement (F5), que
# max-age seul ne couvre pas.
#
# Portée volontairement étroite : les images des trois répertoires d'uploads, toutes
# rendues via $assets->get(). Le .* couvre les sous-répertoires d'archivage par année
# (evenements/2024/…) et les galeries de lieux. web/css et web/js sont versionnés de la
# même façon et pourraient suivre, mais c'est un autre changement.
<IfModule mod_headers.c>
  <If "%{REQUEST_URI} =~ m#^/web/uploads/(evenements|lieux|organisateurs)/.*\.(?i:jpe?g|png|gif|webp)$#">
    Header set Cache-Control "public, max-age=31536000, immutable"
  </If>
</IfModule>
